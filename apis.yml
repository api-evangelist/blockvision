name: BlockVision
description: >-
  BlockVision is a Web3 data infrastructure provider offering multi-chain node, indexing,
  and on-chain data-retrieval APIs for developers building decentralized applications.
  Its stack includes an Indexing API service (real-time account, coin/token, NFT, DeFi,
  DEX-market and smart-contract data across Sui, Monad, Ethereum, Arbitrum, BNB Chain,
  Optimism and Polygon), an RPC Node service (AceNode) with geo-distributed low-latency
  and archive access, a gRPC endpoint for Sui, and Explorer-as-a-Service (branded block
  explorers such as SuiVision and BBScan). Requests to the Data API (api.blockvision.org,
  versioned under /v2) are authenticated with an x-api-key header and metered in Compute
  Units. Originally added to the API Evangelist network as a portfolio company of Qiming,
  this profile has been enriched from BlockVision's public developer surface.
