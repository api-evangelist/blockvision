paths:
  /sui/account/activities:
    get:
      summary: Retrieve Account Activity
      description: Return the historical activity of an account without the need to scan the entire blockchain.
      operationId: retrieve-account-activity
      parameters:
      - name: address
        in: query
        description: account address
        required: true
        schema:
          type: string
          default: '0x4f21032bd4257c2d67a8f7c7bf8055f3c9516b57bb777cb0a724bb16adff63df'
      - name: cursor
        in: query
        description: next page cursor. 10 piece of transactions is returned for each request.
        schema:
          type: string
      - name: limit
        in: query
        description: the maximum number of results to return per page. Defaults to 20, maximum is 50.
        schema:
          type: integer
          format: int32
          default: 20
