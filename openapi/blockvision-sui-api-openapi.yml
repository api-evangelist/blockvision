  /sui/nft/list:
    get:
      summary: Retrieve Collection NFT List
      description: Returns the NFT list of a NFT collection by a given object type.
      operationId: retrieve-collection-nft-list
      parameters:
      - name: objectType
        in: query
        description: '`string` - the object type for the collection to get the NFT list.'
        required: true
        schema:
          type: string
          default: 0xf1681f601a1c021a0b4c8c8859d50917308fcbebfd19364c4e856ac670bb8496%3A%3Asuishi%3A%3ASuishi
      - name: cursor
        in: query
        description: next page cursor.
        schema:
          type: string
          default: '0x0469e53b64b97592248bd0f163df06a8b2b4bebc71da2a2e57a871a454b8582e'
      - name: limit
        in: query
        description: the maximum number of results to return per page. Defaults to 20, maximum is 50.
        schema:
          type: integer
          format: int32
          default: 20
