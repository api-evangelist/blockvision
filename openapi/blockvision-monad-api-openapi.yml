openapi: 3.2.0
info:
  title: blockvision_v2 Monad API
  version: '2.0'
servers:
- url: https://api.blockvision.org/v2
security:
- sec0: []
tags:
- name: Monad
paths:
  /monad/account/activities:
    get:
      summary: Retrieve Account Activity
      description: Returns the historical activity of any address on Monad.
      operationId: retrieve-monad-account-activity
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          default: '0xE19559235c1cD07FE1293ffc4bD5bF9848dC4ED2'
      - name: cursor
        in: query
        description: next page cursor.
        schema:
          type: string
      - name: limit
        in: query
        description: default 20, max 50
        schema:
          type: integer
          format: int32
          default: 20
      - name: ascendingOrder
        in: query
        description: query result ordering, default to false (descending order), newest record first.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"code\": 0,\n    \"reason\": \"\",\n    \"message\": \"OK\",\n    \"result\": {\n        \"data\": [\n            {\n                \"hash\": \"0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3\",\n                \"timestamp\": 1737687692000,\n                \"txStatus\": 1,\n                \"transactionAddress\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                \"from\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                \"to\": \"0x581b1dd14731efe7986db62e2a003e859147ed14\",\n                \"transactionFee\": \"0.00109\",\n                \"txName\": \"Receive\",\n                \"txContract\": {\n                    \"contractAddress\": \"\",\n                    \"contractName\": \"\",\n                    \"project\": \"\",\n                    \"logo\": \"\"\n                },\n                \"addTokens\": [\n                    {\n                        \"txHash\": \"0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3\",\n                        \"from\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                        \"to\": \"0x581b1dd14731efe7986db62e2a003e859147ed14\",\n                        \"contractAddress\": \"0x0000000000000000000000000000000000000000\",\n                        \"value\": \"999999999998908000000000000\",\n                        \"amount\": 999999999.998908,\n                        \"symbol\": \"MON\",\n                        \"decimals\": 18,\n                        \"logo\": \"https://imagedelivery.net/cBNDGgkrsEA-b_ixIp9SkQ/MON.png/public\",\n                        \"usdValue\": \"\",\n                        \"verified\": true\n                    }\n                ],\n                \"subTokens\": [],\n                \"tokenApproval\": null\n            }\n        ],\n        \"nextPageCursor\": 0,\n        \"total\": 1\n    }\n}"
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                    default: 0
                  reason:
                    type: string
                    example: ''
                  message:
                    type: string
                    example: OK
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            hash:
                              type: string
                              example: '0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3'
                            timestamp:
                              type: integer
                              example: 1737687692000
                              default: 0
                            txStatus:
                              type: integer
                              example: 1
                              default: 0
                            transactionAddress:
                              type: string
                              example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                            from:
                              type: string
                              example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                            to:
                              type: string
                              example: '0x581b1dd14731efe7986db62e2a003e859147ed14'
                            transactionFee:
                              type: string
                              example: '0.00109'
                            txName:
                              type: string
                              example: Receive
                            txContract:
                              type: object
                              properties:
                                contractAddress:
                                  type: string
                                  example: ''
                                contractName:
                                  type: string
                                  example: ''
                                project:
                                  type: string
                                  example: ''
                                logo:
                                  type: string
                                  example: ''
                            addTokens:
                              type: array
                              items:
                                type: object
                                properties:
                                  txHash:
                                    type: string
                                    example: '0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3'
                                  from:
                                    type: string
                                    example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                                  to:
                                    type: string
                                    example: '0x581b1dd14731efe7986db62e2a003e859147ed14'
                                  contractAddress:
                                    type: string
                                    example: '0x0000000000000000000000000000000000000000'
                                  value:
                                    type: string
                                    example: '999999999998908000000000000'
                                  amount:
                                    type: number
                                    example: 999999999.998908
                                    default: 0
                                  symbol:
                                    type: string
                                    example: MON
                                  decimals:
                                    type: integer
                                    example: 18
                                    default: 0
                                  logo:
                                    type: string
                                    example: https://imagedelivery.net/cBNDGgkrsEA-b_ixIp9SkQ/MON.png/public
                                  usdValue:
                                    type: string
                                    example: ''
                                  verified:
                                    type: boolean
                                    example: true
                                    default: true
                            subTokens:
                              type: array
                            tokenApproval: {}
                      nextPageCursor:
                        type: integer
                        example: 0
                        default: 0
                      total:
                        type: integer
                        example: 1
                        default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Monad
  /monad/account/defiPortfolio:
    get:
      description: Return account‘s DeFi portfolio on Monad Network
      operationId: get_monadaccountdefiPortfolio
      responses:
        '200':
          description: ''
      parameters:
      - in: query
        name: address
        schema:
          type: string
          default: '0x884F5C47fA1eCaF0C8957611f648Fb320551ab51'
        required: true
      summary: Retrieve Account DeFi
      tags:
      - Monad
  /monad/account/internal/transactions:
    get:
      summary: Retrieve Account Internal Transactions
      description: Returns all internal transactions of any given address Monad
      operationId: retrieve-account-internal-transactions
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          default: '0x4ea043757F7D2E0B386b26E57633eD97863FF63D'
      - name: filter
        in: query
        description: all, from, to
        schema:
          type: string
          default: all
      - name: cursor
        in: query
        description: next page cursor.
        schema:
          type: string
      - name: limit
        in: query
        description: default 20, max 50
        schema:
          type: integer
          format: int32
          default: 20
      - name: ascendingOrder
        in: query
        description: query result ordering, default to false (descending order), newest record first.
