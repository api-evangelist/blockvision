  /monad/account/nfts:
    get:
      summary: Retrieve Account NFTs
      description: Returns all non-fungible tokens currently held by any given address on the Monad.
      operationId: retrieve-monad-account-nfts
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          default: '0x73AD6DDB6A1030271038719342c40D29F8d03441'
