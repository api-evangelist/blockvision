      description: Returns the NFT list of a NFT collection by a given object type.
      operationId: retrieve-collection-nft-list
      parameters:
      - name: objectType
        in: query
        description: '`string` - the object type for the collection to get the NFT list.'
        required: true
        schema:
          type: string
          default: 0xf1681f601a1c021a0b4c8c8859d50917308fcbebfd19364c4e856ac670bb8496%3A%3Asuishi%3A%3ASuishi
