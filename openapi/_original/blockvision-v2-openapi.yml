paths:
  /monad/account/activities:
    get:
      summary: Retrieve Account Activity
      description: Returns the historical activity of any address on Monad.
      operationId: retrieve-monad-account-activity
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          default: '0xE19559235c1cD07FE1293ffc4bD5bF9848dC4ED2'
      - name: cursor
        in: query
        description: next page cursor.
        schema:
          type: string
      - name: limit
        in: query
        description: default 20, max 50
        schema:
          type: integer
          format: int32
          default: 20
      - name: ascendingOrder
        in: query
        description: query result ordering, default to false (descending order), newest record first.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"code\": 0,\n    \"reason\": \"\",\n    \"message\": \"OK\",\n    \"result\": {\n        \"data\": [\n            {\n                \"hash\": \"0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3\",\n                \"timestamp\": 1737687692000,\n                \"txStatus\": 1,\n                \"transactionAddress\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                \"from\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                \"to\": \"0x581b1dd14731efe7986db62e2a003e859147ed14\",\n                \"transactionFee\": \"0.00109\",\n                \"txName\": \"Receive\",\n                \"txContract\": {\n                    \"contractAddress\": \"\",\n                    \"contractName\": \"\",\n                    \"project\": \"\",\n                    \"logo\": \"\"\n                },\n                \"addTokens\": [\n                    {\n                        \"txHash\": \"0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3\"\
                    ,\n                        \"from\": \"0x27d502b0e8bc953b31d297377c6ec6a47b36fb78\",\n                        \"to\": \"0x581b1dd14731efe7986db62e2a003e859147ed14\",\n                        \"contractAddress\": \"0x0000000000000000000000000000000000000000\",\n                        \"value\": \"999999999998908000000000000\",\n                        \"amount\": 999999999.998908,\n                        \"symbol\": \"MON\",\n                        \"decimals\": 18,\n                        \"logo\": \"https://imagedelivery.net/cBNDGgkrsEA-b_ixIp9SkQ/MON.png/public\",\n                        \"usdValue\": \"\",\n                        \"verified\": true\n                    }\n                ],\n                \"subTokens\": [],\n                \"tokenApproval\": null\n            }\n        ],\n        \"nextPageCursor\": 0,\n        \"total\": 1\n    }\n}"
