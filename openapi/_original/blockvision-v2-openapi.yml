                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                    default: 0
                  reason:
                    type: string
                    example: ''
                  message:
                    type: string
                    example: OK
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            hash:
                              type: string
                              example: '0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3'
                            timestamp:
                              type: integer
                              example: 1737687692000
                              default: 0
                            txStatus:
                              type: integer
                              example: 1
                              default: 0
                            transactionAddress:
                              type: string
                              example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                            from:
                              type: string
                              example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                            to:
                              type: string
                              example: '0x581b1dd14731efe7986db62e2a003e859147ed14'
                            transactionFee:
                              type: string
                              example: '0.00109'
                            txName:
                              type: string
                              example: Receive
                            txContract:
                              type: object
                              properties:
                                contractAddress:
                                  type: string
                                  example: ''
                                contractName:
                                  type: string
                                  example: ''
                                project:
                                  type: string
                                  example: ''
                                logo:
                                  type: string
                                  example: ''
                            addTokens:
                              type: array
                              items:
                                type: object
                                properties:
                                  txHash:
                                    type: string
                                    example: '0x9beb87709c2da58c00221e8d5975f5791745d198ee8c15dea6dd17bfcb910bd3'
                                  from:
                                    type: string
                                    example: '0x27d502b0e8bc953b31d297377c6ec6a47b36fb78'
                                  to:
                                    type: string
                                    example: '0x581b1dd14731efe7986db62e2a003e859147ed14'
                                  contractAddress:
                                    type: string
                                    example: '0x0000000000000000000000000000000000000000'
                                  value:
                                    type: string
                                    example: '999999999998908000000000000'
                                  amount:
                                    type: number
                                    example: 999999999.998908
                                    default: 0
                                  symbol:
                                    type: string
                                    example: MON
                                  decimals:
                                    type: integer
                                    example: 18
                                    default: 0
                                  logo:
                                    type: string
                                    example: https://imagedelivery.net/cBNDGgkrsEA-b_ixIp9SkQ/MON.png/public
                                  usdValue:
                                    type: string
                                    example: ''
                                  verified:
                                    type: boolean
                                    example: true
                                    default: true
                            subTokens:
                              type: array
                            tokenApproval: {}
