    get:
      description: Retrieve a paginated list of token trades from the decentralized exchange (DEX). Each record contains detailed information about the swap.
      operationId: get_monadtokentrades
      responses:
        '200':
          description: ''
          content: {}
      parameters:
      - in: query
        name: contractAddress
        schema:
          type: string
          default: '0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A'
        required: true
        description: a 42 character address with '0x' as prefix. The on-chain address of the token’s smart contract.
      - in: query
        name: type
        schema:
          type: string
          default: sell,buy
        required: false
        description: trade type or action descriptor (e.g., `"buy,sell"`).
      - in: query
        name: sender
        schema:
          type: string
        description: address of the trade sender.
      - in: query
        name: limit
        schema:
          type: integer
